name: Metrics & Snake

on:
  schedule:
    - cron: "0 */1 * * *"   # 每 1 小时跑一次（合法写法）
  workflow_dispatch:
  push:
    branches: ["master", "main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      # 1. 个人信息（左列）
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          use_prebuilt_image: yes
          filename: github-metrics.svg
          config_timezone: Asia/Shanghai
          base: header, activity, community, repositories, metadata
          base_hide: comments, discussions, issues, pullrequests, sponsorships

      # 2. 半年度日历（右上）
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          use_prebuilt_image: yes
          base: ""
          filename: metrics.plugin.isocalendar.svg
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_timezone: Asia/Shanghai

      # 3. 语言活动（右下）
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          use_prebuilt_image: yes
          base: ""
          filename: metrics.plugin.languages.svg
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, shell
          plugin_languages_details: percentage
          config_timezone: Asia/Shanghai

      # 4. 贪吃蛇动画（生成到 dist 目录）
      - name: generate github contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: MCsmallbee
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9&color_background=#aaaaaa

      # 5. 把 dist 推到 output 分支（供 README / GitHub Pages 使用）
      - name: push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
